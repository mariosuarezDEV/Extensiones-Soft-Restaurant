<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block titulo %}Soft Manager{% endblock titulo %}</title>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark border-bottom border-primary border-3">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="/mantenimiento">Soft Manager</a>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/mantenimiento">Ajuste de ventas</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container flex-grow-1 py-4 py-md-5">
        {% block contenido %}
        {% endblock contenido %}
    </main>

    <footer class="border-top bg-body py-3">
        <div class="container small text-body-secondary">
            Soft Manager &middot; Administración de ventas Soft Restaurant
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock scripts %}
</body>
</html>
