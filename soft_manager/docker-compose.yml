# Un backend por sucursal (misma imagen) y un frontend que elige a cuál llamar.
# Requiere Tailscale activo en el equipo que corre Docker.
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &backend-env
    DB_NAME: ${DB_NAME:-softrestaurant11}
    DB_USER: ${DB_USER:-sa}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_PORT: ${DB_PORT:-1433}

services:
  backend-centro:
    <<: *backend
    environment:
      <<: *backend-env
      DB_HOST: ${DB_HOST_CENTRO}

  backend-araucarias:
    <<: *backend
    environment:
      <<: *backend-env
      DB_HOST: ${DB_HOST_ARAUCARIAS}

  backend-anahuac:
    <<: *backend
    environment:
      <<: *backend-env
      DB_HOST: ${DB_HOST_ANAHUAC}

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Publico (todas las interfaces) y SIN autenticacion
    # Solo localhost: los demas contenedores entran por la red interna
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker/resultados de Celery (solo red interna)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ejecuta los mantenimientos en segundo plano (hilos: comparte MongoClient)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    command:
      ["uv", "run", "--no-sync", "celery", "-A", "tareas", "worker",
       "--pool=threads", "--concurrency=3", "--loglevel=info"]
    environment:
      BACKEND_CENTRO: backend-centro
      BACKEND_ARAUCARIAS: backend-araucarias
      BACKEND_ANAHUAC: backend-anahuac
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/}
      HISTORIAL_API_URL: ${HISTORIAL_API_URL:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      backend-centro:
        condition: service_started
      backend-araucarias:
        condition: service_started
      backend-anahuac:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    environment:
      BACKEND_CENTRO: backend-centro
      BACKEND_ARAUCARIAS: backend-araucarias
      BACKEND_ANAHUAC: backend-anahuac
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/}
      HISTORIAL_API_URL: ${HISTORIAL_API_URL:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      backend-centro:
        condition: service_started
      backend-araucarias:
        condition: service_started
      backend-anahuac:
        condition: service_started

volumes:
  mongo_data:
